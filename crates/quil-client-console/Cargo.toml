[workspace]
members = ["."]
resolver = "2"

[package]
name = "quil-client-console"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone interactive console for Quilibrium"

[[bin]]
name = "qclient-console"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
quil-client = { path = "../quil-client" }
quil-config = { path = "../quil-config" }
quil-crypto = { path = "../quil-crypto" }
quil-execution = { path = "../quil-execution", features = ["native-proof"] }
quil-forest = { path = "../quil-forest" }
quil-hypergraph = { path = "../quil-hypergraph" }
quil-keys = { path = "../quil-keys" }
quil-p2p = { path = "../quil-p2p" }
quil-rpc = { path = "../quil-rpc" }
quil-lattice-ct = { path = "../quil-lattice-ct", features = ["native-proof"] }
quil-tries = { path = "../quil-tries" }
quil-types = { path = "../quil-types" }
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.28", features = ["event-stream"] }
ed448-goldilocks-plus = "0.16.0"
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.56", features = ["tokio", "yamux", "tcp", "quic", "identify", "ping", "macros"] }
num-bigint = "0.4"
prost = "0.13"
ratatui = "0.29"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
unicode-segmentation = "1"
unicode-width = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
commonware-consensus = { path = "../commonware-consensus" }
jmt = { path = "../jmt" }
libp2p-autonat = { path = "../libp2p-autonat" }
libp2p-gossipsub = { path = "../libp2p-gossipsub" }
libp2p-identity = { path = "../libp2p-identity" }
libp2p-tls = { path = "../libp2p-tls" }
